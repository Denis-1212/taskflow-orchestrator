networks:
  taskflow-network:
    driver: bridge

services:
  # ==================== Databases ====================
  auth-db:
    image: postgres:15-alpine
    container_name: taskflow-auth-db
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow123}
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  project-db:
    image: postgres:15-alpine
    container_name: taskflow-project-db
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow123}
      POSTGRES_DB: project_db
    ports:
      - "5433:5432"
    volumes:
      - project-db-data:/var/lib/postgresql/data
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d project_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  task-db:
    image: postgres:15-alpine
    container_name: taskflow-task-db
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow123}
      POSTGRES_DB: task_db
    ports:
      - "5434:5432"
    volumes:
      - task-db-data:/var/lib/postgresql/data
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d task_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:15-alpine
    container_name: taskflow-notification-db
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow123}
      POSTGRES_DB: notification_db
    ports:
      - "5435:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-db:
    image: postgres:15-alpine
    container_name: taskflow-audit-db
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow123}
      POSTGRES_DB: audit_db
    ports:
      - "5436:5432"
    volumes:
      - audit-db-data:/var/lib/postgresql/data
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d audit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Cache & Message Broker ====================
  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-taskflow123}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: taskflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: taskflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-taskflow123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==================== Observability ====================
  seq:
    image: datalust/seq:2024.3
    container_name: taskflow-seq
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    networks:
      - taskflow-network
    
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: taskflow-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - taskflow-network


  prometheus:
    image: prom/prometheus:latest
    container_name: taskflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - taskflow-network

  grafana:
    image: grafana/grafana:latest
    container_name: taskflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deployments/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - taskflow-network
    depends_on:
      - prometheus

  # ==================== Services ====================
  auth-service:
    build:
      context: .
      dockerfile: src/Services/TaskFlow.Services.Auth/Dockerfile
    container_name: taskflow-auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production     
      - ConnectionStrings__DefaultConnection=Host=auth-db;Port=5432;Database=auth_db;Username=taskflow;Password=${POSTGRES_PASSWORD:-taskflow123}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=TaskFlow
      - Jwt__Audience=TaskFlow
      - Jwt__AccessTokenExpirationMinutes=3
      - ConnectionStrings__Redis=redis,password=${REDIS_PASSWORD:-taskflow123}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=taskflow
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-taskflow123}
      - RabbitMQ__VirtualHost=/
      - Ports__Rest=5001
      - Ports__Grpc=5007
    ports:
      - "5001:5001"
    networks:
      - taskflow-network
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  project-service:
    build:
      context: .
      dockerfile: src/Services/TaskFlow.Services.Project/Dockerfile
    container_name: taskflow-project-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production    
      - ConnectionStrings__DefaultConnection=Host=project-db;Port=5432;Database=project_db;Username=taskflow;Password=${POSTGRES_PASSWORD:-taskflow123}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=taskflow
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-taskflow123}
      - RabbitMQ__VirtualHost=/    
      - Ports__Rest=5002
      - Ports__Grpc=5006
    ports:
      - "5002:5002"
    networks:
      - taskflow-network
    depends_on:
      project-db:
        condition: service_healthy

  task-service:
    build:
      context: .
      dockerfile: src/Services/TaskFlow.Services.Task/Dockerfile
    container_name: taskflow-task-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=task-db;Port=5432;Database=task_db;Username=taskflow;Password=${POSTGRES_PASSWORD:-taskflow123}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=taskflow
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-taskflow123}
      - RabbitMQ__VirtualHost=/
      - Ports__Rest=5003
    ports:
      - "5003:5003"
    networks:
      - taskflow-network
    depends_on:
      task-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: src/Services/TaskFlow.Services.Notification/Dockerfile
    container_name: taskflow-notification-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=notification-db;Port=5432;Database=notification_db;Username=taskflow;Password=${POSTGRES_PASSWORD:-taskflow123}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=taskflow
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-taskflow123}
      - RabbitMQ__VirtualHost=/
      - Ports__Rest=5004
    ports:
      - "5004:5004"
    networks:
      - taskflow-network
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  audit-service:
    build:
      context: .
      dockerfile: src/Services/TaskFlow.Services.Audit/Dockerfile
    container_name: taskflow-audit-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=audit-db;Port=5432;Database=audit_db;Username=taskflow;Password=${POSTGRES_PASSWORD:-taskflow123}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=taskflow
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-taskflow123}
      - RabbitMQ__VirtualHost=/
      - Ports__Rest=5005
    ports:
      - "5005:5005"
    networks:
      - taskflow-network
    depends_on:
      audit-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/TaskFlow.ApiGateway/Dockerfile
    container_name: taskflow-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=TaskFlow
      - Jwt__Audience=TaskFlow
      - Jwt__AccessTokenExpirationMinutes=3
    ports:
      - "8080:8080"
    networks:
      - taskflow-network
    depends_on:
      - auth-service
      - project-service
      - task-service
      - notification-service
      - audit-service

volumes:
  auth-db-data:
  project-db-data:
  task-db-data:
  notification-db-data:
  audit-db-data:
  redis-data:
  rabbitmq-data:
  seq-data:
  prometheus-data:
  grafana-data: